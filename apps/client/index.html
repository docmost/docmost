<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no" />
    <title>Docmost</title>
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Docmost" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      /* Paint the document's header and sidebar surfaces until React mounts. */
      #root[data-document-entry]:empty {
        box-sizing: border-box;
        min-height: 100dvh;
        background: light-dark(white, #242424);
        border-block-start: 45px solid light-dark(#f6f7f9, #1f1f1f);
      }
      @media (min-width: 48em) {
        #root[data-document-entry]:empty {
          border-inline-start: var(--entry-sidebar-width, 300px) solid light-dark(#f6f7f9, #1f1f1f);
        }
      }
    </style>
    <!--meta-tags-->
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (/^\/s\/[^/]+\/p\//.test(location.pathname)) {
        const root = document.getElementById("root");
        root.dataset.documentEntry = "";
        try {
          const width = Number(localStorage.getItem("sidebarWidth")) || 300;
          const open = localStorage.getItem("showSidebar") !== "false";
          root.style.setProperty("--entry-sidebar-width", open ? Math.min(600, Math.max(220, width)) + "px" : "0px");
          const theme = localStorage.getItem("mantine-color-scheme-value");
          document.documentElement.dataset.mantineColorScheme =
            theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        } catch { /* Storage can be unavailable in a private browser. */ }
      }
    </script>

    <!--window-config-->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
