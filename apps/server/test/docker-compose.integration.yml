name: docmost-cycle-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost_cycle_test
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: docmost
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docmost -d docmost_cycle_test']
      interval: 2s
      timeout: 2s
      retries: 15
